spring.application.name=clarigence-contact-api
# Keep local/container sessions unchanged unless the vercel profile is enabled.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
server.port=${SERVER_PORT:${PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clarigence?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:clarigence_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-binding-errors=never
